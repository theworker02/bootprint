name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Ruby 3.4 / full gate
            os: ubuntu-latest
            ruby: "3.4"
            full: true
          - name: Linux / Ruby 3.1
            os: ubuntu-latest
            ruby: "3.1"
            full: false
          - name: macOS / Ruby 3.4
            os: macos-latest
            ruby: "3.4"
            full: false
          - name: Windows / Ruby 3.4
            os: windows-latest
            ruby: "3.4"
            full: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Run RuboCop
        if: matrix.full
        run: bundle exec rake lint
      - name: Build RubyGem
        if: matrix.full
        run: bundle exec rake package
      - name: Install and smoke-test RubyGem
        if: matrix.full
        run: |
          gem install pkg/bootprint-*.gem --install-dir tmp/gem-home --bindir tmp/gem-bin --no-document
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint --version
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint help
      - name: Upload RubyGem
        if: matrix.full
        uses: actions/upload-artifact@v4
        with:
          name: bootprint-rubygem
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7
