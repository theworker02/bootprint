name: Finalize Bootprint 0.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v0.3.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Validate and record diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '$ bundle exec rake check'
            bundle exec rake check
            echo '$ gem build bootprint.gemspec'
            mkdir -p pkg
            gem build bootprint.gemspec --output pkg/bootprint-0.3.0.gem
            echo '$ installed gem smoke test'
            rm -rf tmp/release-gem tmp/release-bin
            gem install pkg/bootprint-0.3.0.gem --install-dir tmp/release-gem --bindir tmp/release-bin --no-document
            GEM_HOME="$PWD/tmp/release-gem" GEM_PATH="$PWD/tmp/release-gem" tmp/release-bin/bootprint --version
            GEM_HOME="$PWD/tmp/release-gem" GEM_PATH="$PWD/tmp/release-gem" ruby -e 'require "bootprint"; abort unless Bootprint::VERSION == "0.3.0" && Bootprint.respond_to?(:matrix)'
          } > validation.log 2>&1
          STATUS=$?
          set -e
          cat validation.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p .release-status
            cp validation.log .release-status/v0.3.0-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm -f .github/workflows/finalize-v0.3.0.yml .release-trigger/0.3.0
            git add -A
            git commit -m "Record Bootprint 0.3.0 validation failure"
            git push origin HEAD:main
            exit "$STATUS"
          fi
      - name: Commit clean release source and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-v0.3.0.yml .release-trigger/0.3.0 .release-status/v0.3.0-failure.txt
          rm -rf pkg tmp/release-gem tmp/release-bin
          git add -A
          git commit -m "Prepare Bootprint 0.3.0 release"
          git push origin HEAD:main
          git tag -a v0.3.0 -m "Bootprint 0.3.0"
          git push origin v0.3.0
      - name: Dispatch trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f confirm_version=0.3.0
