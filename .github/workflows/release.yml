name: Release RubyGem

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.confirm_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.confirm_version }}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag, gem version, and changelog
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          bundle exec ruby -Ilib -e 'require "bootprint/version"; abort "tag/version mismatch" unless "v#{Bootprint::VERSION}" == ENV.fetch("RELEASE_TAG")'
          grep -F "## ${RELEASE_VERSION} -" CHANGELOG.md

      - name: Run release checks
        run: bundle exec rake check

      - name: Build and smoke-test the exact package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p pkg
          gem build bootprint.gemspec --output "pkg/bootprint-${RELEASE_VERSION}.gem"
          gem install "pkg/bootprint-${RELEASE_VERSION}.gem" --install-dir tmp/gem-home --bindir tmp/gem-bin --no-document
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint --version
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint help
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" ruby -e 'require "bootprint"; abort unless Bootprint::VERSION == ENV.fetch("RELEASE_VERSION") && Bootprint.respond_to?(:matrix)'

      - name: Record package digest
        run: ruby -rdigest -e "paths = Dir['pkg/*.gem']; abort 'expected one package' unless paths.one?; puts 'SHA256  ' + Digest::SHA256.file(paths.first).hexdigest"

      - name: Check RubyGems publication
        id: published
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS "https://rubygems.org/api/v1/versions/bootprint.json" \
            | jq -e --arg version "$RELEASE_VERSION" 'any(.[]; .number == $version)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to RubyGems
        if: steps.published.outputs.exists != 'true'
        uses: rubygems/release-gem@v1

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          GEM_PATH="pkg/bootprint-${RELEASE_VERSION}.gem"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$GEM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$GEM_PATH" --verify-tag --generate-notes --title "Bootprint ${RELEASE_VERSION}"
          fi
