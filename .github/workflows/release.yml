name: Release RubyGem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify tag, gem version, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          bundle exec ruby -Ilib -e 'require "bootprint/version"; abort "tag/version mismatch" unless "v#{Bootprint::VERSION}" == ENV.fetch("RELEASE_TAG")'
          grep -F "## ${VERSION} -" CHANGELOG.md
      - name: Run release checks
        run: bundle exec rake check
      - name: Build and smoke-test the exact package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p pkg
          gem build bootprint.gemspec --output "pkg/bootprint-${VERSION}.gem"
          gem install "pkg/bootprint-${VERSION}.gem" --install-dir tmp/gem-home --bindir tmp/gem-bin --no-document
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint --version
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" tmp/gem-bin/bootprint help
      - name: Publish to RubyGems with trusted publishing
        uses: rubygems/release-gem@v1
      - name: Record published package digest
        run: ruby -rdigest -e 'paths = Dir["pkg/*.gem"]; abort "expected one package" unless paths.one?; puts "SHA256  #{Digest::SHA256.file(paths.first).hexdigest}"'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" pkg/*.gem --verify-tag --generate-notes --title "Bootprint ${RELEASE_TAG#v}"
