version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Minitest 6 requires Ruby >= 3.2; this gem supports Ruby >= 3.1.
    ignore:
      - dependency-name: "minitest"
        versions: [">= 6.0"]
    groups:
      ruby-development-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
