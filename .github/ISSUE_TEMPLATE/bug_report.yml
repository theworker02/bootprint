name: Bug report
description: Report incorrect capture, diagnosis, privacy, or CLI behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach production snapshots or secrets. Redact paths and environment names.
  - type: input
    id: version
    attributes:
      label: Bootprint and Ruby versions
      placeholder: bootprint 0.2.0 / ruby 3.4.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized reproduction
    validations:
      required: true
